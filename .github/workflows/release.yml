name: Release

on:
  push:
    tags: ["v*"]

# Default to read-only; the release job opts into what it needs.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o darkreel-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darkreel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: darkreel-${{ matrix.goos }}-${{ matrix.goarch }}

  # This job holds SIGNING_KEY, so it runs no third-party or marketplace
  # action code at all — only shell, openssl and the runner's preinstalled
  # gh CLI. (A compromised action in the same job could read the key from
  # the runner's memory.) Artifacts are fetched and the release is created
  # with gh.
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }

      - name: Download artifacts
        run: |
          gh run download "${{ github.run_id }}" --dir dist
          mkdir release
          for bin in dist/darkreel-linux-*/darkreel-linux-*; do
            cp "$bin" release/
          done
          ls -l release

      - name: Create checksums and sign
        working-directory: release
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          sha256sum darkreel-linux-* > checksums.txt
          cat checksums.txt

          # Each signature covers a manifest binding the product, the release
          # tag, the asset name and its hash — not the bare hash. update.sh
          # rebuilds the manifest from what it is installing, so an older
          # signed binary can't be re-published under a newer tag and one
          # architecture's binary can't stand in for another's.
          # Key passed via fd, never written to disk.
          for bin in darkreel-linux-*; do
            printf 'darkreel-release-v1\n%s\n%s\n%s\n' "$TAG" "$bin" "$(sha256sum "$bin" | awk '{print $1}')" > "$bin.manifest"
            openssl pkeyutl -sign -inkey <(printf '%s' "$SIGNING_KEY") -rawin -in "$bin.manifest" -out "$bin.sig"
            rm -f "$bin.manifest"
          done

      - name: Create release
        working-directory: release
        run: |
          gh release create "$TAG" --verify-tag --generate-notes \
            darkreel-linux-* checksums.txt
